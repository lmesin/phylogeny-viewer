<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secondary GC outcomes and antibody output</title><style>*{box-sizing:border-box}body{margin:0;background:#E9E7E6;font-family:Arial,sans-serif;color:#222}main{max-width:1800px;margin:auto;padding:12px}canvas{width:100%;height:auto;display:block;background:white}nav,.controls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{padding:8px 12px;border:1px solid #777;border-radius:4px;background:white;color:#222;cursor:pointer}button[aria-pressed=true]{background:#333;color:white}input{flex:1;min-width:100px}button:focus-visible{outline:3px solid #007d71}#time{font-size:14px;align-self:center}</style></head><body><main><nav aria-label="Animation stages"><button data-stage>Primary selection</button><button data-stage>Contralateral</button><button data-stage>Ipsilateral homologous</button><button data-stage>Ipsilateral heterologous</button></nav><canvas id="scene" width="3840" height="2160" aria-label="Animated schematic of primary and secondary germinal centers"></canvas><div class="controls"><button id="play">Play</button><button id="restart">Restart</button><input id="seek" type="range" min="0" max="49.499" step="0.05" value="0" aria-label="Animation time"><span id="time"></span><button id="fullscreen">Full screen</button></div></main><script>const rawContext=document.getElementById('scene').getContext('2d');rawContext.scale(2,2);
const spec={"width": 1920, "height": 1080, "duration": 49.5, "colors": {"naive": "#D1D4D5", "primary": "#D45170", "memory": "#D45170", "selected": "#EEA9B4", "burst": "#BE0B47", "variantPrimary": "#A600B5", "variantNaive": "#D9F1F8", "blue": "#007CAD"}, "stages": [{"start": 0, "end": 7.5, "name": "Primary selection", "description": "Antigen-specific B cells seed the primary GC and generate memory."}, {"start": 7.5, "end": 21.5, "name": "Contralateral boost", "description": "A new GC forms mainly from na\u00efve B cells."}, {"start": 21.5, "end": 35.5, "name": "Ipsilateral homologous boost", "description": "A primary GC lineage bursts and expands after refueling."}, {"start": 35.5, "end": 49.5, "name": "Ipsilateral heterologous boost", "description": "Primary lineages adapt alongside a de novo variant-reactive response."}]};
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
function clamp(x){return Math.max(0,Math.min(1,x))}function ease(x){x=clamp(x);return x*x*(3-2*x)}function mix(a,b,t){return a+(b-a)*t}function rgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))}function color(a,b,t){const A=rgb(a),B=rgb(b);return '#'+A.map((v,i)=>Math.round(mix(v,B[i],t)).toString(16).padStart(2,'0')).join('')}
function cell(x,y,r,fill,receptor=false,alpha=1){r*=1.10;ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=fill;ctx.strokeStyle='#555';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();if(receptor){ctx.strokeStyle='#555';ctx.lineWidth=r*.24;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x+r*.18,y-r*.48);ctx.lineTo(x+r*.43,y-r*1.1);ctx.lineTo(x+r*.41,y-r*1.55);ctx.moveTo(x+r*.43,y-r*1.1);ctx.lineTo(x+r*.98,y-r*1.3);ctx.stroke();ctx.strokeStyle=fill;ctx.lineWidth=r*.17;ctx.stroke()}ctx.restore()}
function text(s,x,y,size=28,fill='#222',align='left',bold=false){ctx.fillStyle=fill;ctx.font=(bold?'bold ':'')+size+'px Arial';ctx.textAlign=align;ctx.fillText(s,x,y)}
function arrow(x1,y1,x2,y2,alpha=1){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle='#666';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-16*Math.cos(a-.45),y2-16*Math.sin(a-.45));ctx.lineTo(x2-16*Math.cos(a+.45),y2-16*Math.sin(a+.45));ctx.closePath();ctx.fillStyle='#666';ctx.fill();ctx.restore()}
function syringe(x,y,fill){ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/4);ctx.strokeStyle='#666';ctx.lineWidth=1.5;ctx.fillStyle='white';ctx.fillRect(-11,-46,22,74);ctx.strokeRect(-11,-46,22,74);ctx.fillStyle=fill;ctx.fillRect(-10,-8,20,35);ctx.beginPath();ctx.moveTo(0,-46);ctx.lineTo(0,-72);ctx.moveTo(-16,-72);ctx.lineTo(16,-72);ctx.moveTo(0,28);ctx.lineTo(0,66);ctx.stroke();ctx.restore()}
function grid(n,x,y,step){return Array.from({length:n},(_,i)=>[x+(i%Math.sqrt(n)-(Math.sqrt(n)-1)/2)*step,y+(Math.floor(i/Math.sqrt(n))-(Math.sqrt(n)-1)/2)*step])}
const primary=grid(9,640,570,70),secondary=grid(16,1240,570,70),pool=[[180,300],[180,420],[180,540]],selectedNaive=[180,740],variantNaive=[180,740],mem=[[860,260],[940,260],[1020,260]];
function centroid(points){return [points.reduce((s,p)=>s+p[0],0)/points.length,points.reduce((s,p)=>s+p[1],0)/points.length]}
// The colony travels along a straight line while successive binary divisions
// separate daughter cells into their final positions. No cells fade into existence.
function dividingLineage(origin,targets,progress,fill,burst=false,receptor=false){
const p=clamp(progress),targetCenter=centroid(targets),center=[mix(origin[0],targetCenter[0],p),mix(origin[1],targetCenter[1],p)];
const positions=targets.map(t=>[t[0]-targetCenter[0],t[1]-targetCenter[1]]);
function grow(points,depth){const c=centroid(points);if(points.length===1){cell(center[0]+c[0],center[1]+c[1],30,fill);return}
const start=burst?.35+depth*.1:.15+depth*.19,split=ease((p-start)/(burst?.095:.17));if(split<=0){cell(center[0]+c[0],center[1]+c[1],30,fill,receptor&&depth===0);return}
const mid=Math.ceil(points.length/2),groups=[points.slice(0,mid),points.slice(mid)];
if(split<1){groups.forEach(g=>{const child=centroid(g);cell(center[0]+mix(c[0],child[0],split),center[1]+mix(c[1],child[1],split),30,fill)})}else groups.forEach(g=>grow(g,depth+1));}
grow(positions,0);
}
function burstGeometry(origin,targets,progress){
const q=clamp(progress),p=q<.42?q/.42*.48:q<.53?.48:.48+(q-.53)/.47*.52;
const targetCenter=centroid(targets),center=[mix(origin[0],targetCenter[0],p),mix(origin[1],targetCenter[1],p)];
const growth=ease((p-.49)/.26);
return {center,growth,positions:targets.map(t=>[center[0]+(t[0]-targetCenter[0])*growth,center[1]+(t[1]-targetCenter[1])*growth])};
}
function burstLineage(origin,targets,progress,fill){
const {center,growth,positions}=burstGeometry(origin,targets,progress);
if(growth<=0){cell(...center,30,fill);return}
const radius=mix(33/Math.sqrt(targets.length),33,ease(growth));
// Stroke the colony first, then fill its cells together: overlapping daughters
// read as one expanding mass until their individual contours separate.
ctx.save();ctx.strokeStyle='#555';ctx.lineWidth=1.5;ctx.fillStyle=fill;
positions.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.stroke()});
positions.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill()});
// Retain the single founder silhouette until its daughters fill the center.
if(growth<.20){ctx.globalAlpha*=1-ease(growth/.20);cell(...center,30,fill)}
ctx.restore();
}
function travel(a,b,p,bend=0){const t=ease(p);return [mix(a[0],b[0],t),mix(a[1],b[1],t)-Math.sin(Math.PI*t)*bend]}
function antibody(x,y,fill,alpha){ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.scale(1.4,1.4);x=0;y=0;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x,y+23);ctx.lineTo(x,y-1);ctx.lineTo(x-15,y-23);ctx.moveTo(x,y-1);ctx.lineTo(x+15,y-23);ctx.strokeStyle='#555';ctx.lineWidth=8.5;ctx.stroke();ctx.strokeStyle=fill;ctx.lineWidth=7;ctx.stroke();ctx.restore()}
function antibodyOutput(k,elapsed,C){const alpha=ease((elapsed-10.4)/1.0);if(alpha<=0)return;ctx.save();ctx.translate(k>1?-620:-90,0);ctx.globalAlpha*=alpha;text('Plasma-cell',1740,405,32,'#222','center',true);text('output',1740,445,32,'#222','center',true);
const fills=k===1?[C.naive,C.naive,C.naive,C.naive,C.memory]:k===2?[C.burst,C.burst,C.burst,C.burst,C.naive]:[C.variantNaive,C.variantNaive,C.variantNaive,C.variantPrimary,C.variantPrimary];
const locations=[[1655,525],[1740,525],[1825,525],[1695,625],[1785,625]];fills.forEach((fill,i)=>{const [x,y]=locations[i];const reveal=ease((elapsed-10.4-i*.14)/.75);antibody(mix(k>1?1460:1465,x,reveal),mix(570,y,reveal),fill,reveal)});
const lines=k===1?['Predominantly','de novo response']:k===2?['Clonally focused','antibody response']:['Cross-reactive and','de novo responses'];
ctx.save();ctx.globalAlpha*=alpha;lines.forEach((line,i)=>text(line,1740,735+i*38,32,'#222','center'));ctx.restore();ctx.restore();}
function drawScene(time){let k=spec.stages.findIndex(s=>time<s.end);if(k<0)k=3;const s=spec.stages[k],u=clamp((time-s.start)/(k===0?7.5:11)),C=spec.colors;
text('Three routes to secondary germinal centers',80,88,44,'#222','left',false);text(s.name,80,155,40,'#222','left',true);text(s.description,80,900,32);
pool.forEach(p=>cell(...p,29,C.naive,true));
[610,632,654].forEach(y=>{ctx.fillStyle='#222';ctx.beginPath();ctx.arc(180,y,3.5,0,Math.PI*2);ctx.fill()});
// Sample the antigen-specific cell once; its source position remains occupied.
const sourceFill=k===0&&u<.08?C.selected:k===3?color(C.naive,C.variantNaive,ease((u-.18)/.08)):C.naive;
cell(...selectedNaive,29,sourceFill,true);
text('Naïve B cells',100,230,32);if(k<2)text('Primary GC',640,405,32,'#222','center');
if(k===0){const p=clamp((u-.08)/.56);if(p>0)dividingLineage(selectedNaive,primary,p,color(C.selected,C.primary,ease((u-.15)/.48)),false,true);ctx.save();ctx.globalAlpha*=ease(u/.08);syringe(360,420,'#888');ctx.restore();if(u>.65){const v=ease((u-.65)/.25);mem.forEach((target,i)=>{const pos=travel(primary[i+3],target,v,30);cell(...pos,29,C.memory)});text('Memory B cells',940,195,32,'#222','center')}return}
if(k===1)primary.forEach(p=>cell(...p,30,C.primary));
const memoryProgress=clamp((u-.12-15*.016)/.48);
mem.forEach((p,i)=>{cell(...p,29,C.memory,false,k===1&&i===1?1-ease(memoryProgress/.12):1)});text('Memory B cells',940,195,32,'#222','center');
if(k===1)text('Secondary GC',1240,405,32,'#222','center',true);ctx.save();ctx.globalAlpha*=.38;syringe(360,420,'#888');ctx.restore();ctx.save();ctx.globalAlpha*=ease((u-.025)/.10);syringe(k===1?940:640,k===1?420:300,k===3?C.blue:'#888');ctx.restore();
if(k===1){secondary.forEach((target,i)=>{const prog=clamp((u-.12-i*.016)/.48);if(prog<=0)return;const origin=i===15?mem[1]:pool[i%3],pos=travel(origin,target,prog,i===15?45:90);cell(...pos,30,i===15?C.memory:C.naive,false,Math.min(1,prog*5))})}
if(k===2||k===3){
// Ipsilateral refueling reuses the same GC location; no founder leaves it.
const niche=grid(16,640,570,70),inheritedIndices=k===2?[2,3,6,7,10,11,14,15]:[6,7,10,11,14,15];
const otherIndices=Array.from({length:16},(_,i)=>i).filter(i=>!inheritedIndices.includes(i));
const founder=primary[5],targetFill=k===2?C.burst:C.variantPrimary;
const labelFade=ease((u-.26)/.16);ctx.save();ctx.globalAlpha*=1-labelFade;text('Primary GC',640,405,32,'#222','center');ctx.restore();ctx.save();ctx.globalAlpha*=labelFade;text('Secondary GC',640,405,32,'#222','center',true);ctx.restore();
// Other pre-existing cells remain visible while the selected clone expands within the niche.
const progress=clamp((u-.10)/.72),fill=color(C.primary,targetFill,ease((u-.18)/.48));
const colony=burstGeometry(founder,inheritedIndices.map(i=>niche[i]),progress);
// The old GC remains intact until the founder expands. Its opacity then
// follows the same continuous expansion curve, without per-cell cutoffs.
const replacement=ease(colony.growth);
primary.forEach((position,i)=>{if(i!==5)cell(...position,30,C.primary,false,1-replacement)});
burstLineage(founder,inheritedIndices.map(i=>niche[i]),progress,fill);
if(k===2){otherIndices.forEach((i,j)=>{const q=clamp((u-.48-j*.012)/.40);if(q<=0)return;const pos=travel(pool[j%3],niche[i],q,60);cell(...pos,30,C.naive,false,Math.min(1,q*5))})}
else if(u>.46){const q=clamp((u-.46)/.46);dividingLineage(variantNaive,otherIndices.map(i=>niche[i]),q,C.variantNaive)}

}
antibodyOutput(k,time-s.start,C);
}
function draw(time){ctx.clearRect(0,0,1920,1080);ctx.fillStyle='white';ctx.fillRect(0,0,1920,1080);const k=spec.stages.findIndex(s=>time<s.end),stage=spec.stages[k<0?3:k],age=time-stage.start,blend=k>0?ease(age/.65):1;if(k>0&&blend<1){ctx.save();ctx.globalAlpha=1-blend;drawScene(stage.start-.001);ctx.restore()}ctx.save();ctx.globalAlpha=blend;drawScene(time);ctx.restore()}
let time=0,playing=false,previous=0,raf;const play=document.getElementById('play'),seek=document.getElementById('seek'),status=document.getElementById('time');
function update(){draw(time);seek.value=time;status.textContent=time.toFixed(1)+' / '+spec.duration+' s';document.querySelectorAll('[data-stage]').forEach((b,i)=>b.setAttribute('aria-pressed',time>=spec.stages[i].start&&time<spec.stages[i].end))}
function loop(t){if(playing){if(previous)time+=(t-previous)/1000;if(time>=spec.duration){time=spec.duration-.001;playing=false;play.textContent='Play'}previous=t;update();raf=requestAnimationFrame(loop)}}
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';previous=0;if(playing){if(time>=spec.duration-.01)time=0;raf=requestAnimationFrame(loop)}};seek.oninput=()=>{time=+seek.value;previous=0;update()};document.getElementById('restart').onclick=()=>{time=0;previous=0;update()};document.querySelectorAll('[data-stage]').forEach((b,i)=>b.onclick=()=>{time=spec.stages[i].start+.001;previous=0;update()});document.getElementById('fullscreen').onclick=()=>canvas.requestFullscreen?.();window.drawAt=t=>{playing=false;time=t;update()};update();
</script></body></html>
